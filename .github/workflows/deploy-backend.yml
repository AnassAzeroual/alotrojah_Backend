name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, fileinfo, mbstring, openssl, pdo_mysql, tokenizer, sodium, zip
          coverage: none
          tools: composer

      - run: composer install --prefer-dist --no-interaction

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Import canonical schema + seed
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS quran_memorization CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h 127.0.0.1 -u root -proot quran_memorization < docs/database/quran_memorization_db.sql
          mysql -h 127.0.0.1 -u root -proot quran_memorization < docs/database/quran_seed_data.sql

      - name: Run test suite
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: quran_memorization
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_KEY: base64:Re+ogP++t/UajqAFUxiFgvg9IkJo2AiZMl5+rV3inu4=
          JWT_SECRET: cimidonlyfortestsdonotuseinprod0000000000000000000000000000
          JWT_TTL: 60
          JWT_REFRESH_TTL: 20160
          CACHE_STORE: file
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: file
        run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, fileinfo, mbstring, openssl, pdo_mysql, tokenizer, sodium, zip
          coverage: none
          tools: composer

      - name: Production build (no dev deps)
        run: composer install --prefer-dist --no-dev --optimize-autoloader --no-interaction

      - name: Render production .env (never committed, uploaded once per deploy)
        run: |
          cat > .env <<'EOF'
          APP_NAME=AlOtrojah
          APP_ENV=production
          APP_DEBUG=false
          APP_URL=https://api.alotrojah.ma
          APP_TIMEZONE=Africa/Casablanca
          APP_KEY=${{ secrets.APP_KEY }}
          DB_CONNECTION=mysql
          DB_HOST=localhost
          DB_PORT=3306
          DB_DATABASE=${{ secrets.PROD_DB_DATABASE }}
          DB_USERNAME=${{ secrets.PROD_DB_USERNAME }}
          DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=file
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_TTL=60
          JWT_REFRESH_TTL=20160
          JWT_ALGO=HS256
          FRONTEND_URL=https://alotrojah.ma
          FRONTEND_URLS=https://alotrojah.ma,https://www.alotrojah.ma
          EOF

      - name: Install lftp (shared-host tolerant FTPS client)
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: FTP deploy via lftp mirror (sequential, resumable)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            set net:max-retries 5;
            set net:timeout 30;
            set net:reconnect-interval-base 5;
            open -u $FTP_USER,\"$FTP_PASS\" $FTP_HOST;
            mkdir -p api;
            mirror -R --continue --parallel=1 --only-newer \
              -X .git/* -X .git/ -X .github/* \
              -X tests/* -X docs/* \
              -X phpunit.xml -X .editorconfig -X .phpunit.result.cache \
              -X database/*.sqlite \
              -X storage/logs/* -X storage/framework/cache/* -X storage/framework/sessions/* -X storage/framework/views/* \
              -X node_modules/* \
              -X vendor/**/tests/* -X vendor/**/Tests/* -X vendor/**/*.md \
              ./ api/;
            bye"

      - name: Verify production
        run: |
          set -e
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.alotrojah.ma/up); test "$code" = "200"
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.alotrojah.ma/api/v1/health); test "$code" = "200"
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.alotrojah.ma/docs/api.json); test "$code" = "403"
          hdr=$(curl -s -D - -o /dev/null -H 'Origin: https://alotrojah.ma' https://api.alotrojah.ma/api/v1/health); echo "$hdr" | grep -qi 'access-control-allow-origin: https://alotrojah.ma'
          echo 'PROD VERIFIED'
