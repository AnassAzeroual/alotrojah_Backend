name: Deploy Backend v2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ctype, curl, fileinfo, json, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          coverage: none

      - name: Lint all PHP files
        run: |
          set -euo pipefail
          git ls-files -z -- '*.php' | xargs -0 -r -n1 php -l

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ctype, curl, fileinfo, json, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          coverage: none

      # Render the production .env from the same GitHub secrets as Laravel.
      - name: Render production .env
        run: |
          cat > .env <<'EOF'
          APP_NAME=AlOtrojah
          APP_ENV=production
          APP_DEBUG=false
          APP_URL=https://api.alotrojah.ma
          APP_TIMEZONE=Africa/Casablanca
          DB_CONNECTION=mysql
          DB_HOST=localhost
          DB_PORT=3306
          DB_DATABASE=${{ secrets.PROD_DB_DATABASE }}
          DB_USERNAME=${{ secrets.PROD_DB_USERNAME }}
          DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_ALGO=HS256
          JWT_TTL=60
          JWT_REFRESH_TTL=20160
          FRONTEND_URL=https://alotrojah.ma
          FRONTEND_URLS=https://alotrojah.ma,https://www.alotrojah.ma
          EOF

      - name: Build backend.zip
        run: |
          php deploy_script/Build-Zip.php .env
          test -f deploy_script/backend.zip
          ls -lh deploy_script/backend.zip

      - name: Stamp extractor with deploy token
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "DEPLOY_TOKEN secret is required." >&2
            exit 1
          fi
          sed "s/__DEPLOY_TOKEN__/${DEPLOY_TOKEN}/" deploy_script/deploy.php > deploy_script/deploy.stamped.php
          if grep -q '__DEPLOY_TOKEN__' deploy_script/deploy.stamped.php; then
            echo "token stamp failed" >&2
            exit 1
          fi

      - name: Install lftp (FTPS client)
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Upload only the archive and the extractor, same mechanism as Laravel.
      - name: Upload zip + extractor via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          printf 'machine %s login %s password %s\n' "$FTP_HOST" "$FTP_USER" "$FTP_PASS" > ~/.netrc
          chmod 600 ~/.netrc
          lftp -e "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            set net:max-retries 5;
            set net:timeout 30;
            set net:reconnect-interval-base 5;
            open $FTP_HOST;
            mkdir -f api;
            mkdir -f api/public;
            put deploy_script/backend.zip -o api/backend.zip;
            put deploy_script/deploy.stamped.php -o api/public/deploy.php;
            bye"
          rm -f ~/.netrc deploy_script/deploy.stamped.php

      - name: Trigger server-side extract
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          set -euo pipefail
          URL="${DEPLOY_URL:-https://api.alotrojah.ma/deploy.php?action=migrate}"
          case "$URL" in
            *\?*) SEP='&' ;;
            *) SEP='?' ;;
          esac
          # Cache-buster: Imunify360/Cloudflare challenge pages can be cached
          # under the deploy URL and then be served to every runner.
          URL="${URL}${SEP}cb=${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}-$(date +%s)"
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'

          HTTP=$(curl -sS --max-time 590 -o deploy.log -w '%{http_code}' \
            -A "$UA" \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            -H 'Sec-Fetch-Site: none' \
            -H 'Sec-Fetch-Mode: navigate' \
            -H 'Sec-Fetch-User: ?1' \
            -H 'Sec-Fetch-Dest: document' \
            -H 'Upgrade-Insecure-Requests: 1' \
            -H 'sec-ch-ua: "Chromium";v="126", "Google Chrome";v="126", "Not-A.Brand";v="99"' \
            -H 'sec-ch-ua-mobile: ?0' \
            -H 'sec-ch-ua-platform: "Windows"' \
            -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
            "$URL")
          echo "deploy HTTP ${HTTP}"
          head -c 1200 deploy.log; echo

          if grep -qi 'Please wait while your request is being verified\|imunify-bot-check' deploy.log; then
            echo 'Imunify360/Cloudflare bot verification intercepted the deploy request.' >&2
            echo 'Whitelist the deploy path (or GitHub runner egress) at the origin/WAF, or set DEPLOY_URL to an allowlisted trigger.' >&2
            exit 1
          fi
          if [ "$HTTP" != "200" ]; then
            echo "Deploy trigger returned HTTP ${HTTP}." >&2
            exit 1
          fi
          grep -q '"ok":true' deploy.log

      - name: Keep deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: deploy.log

      - name: Verify production
        env:
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: |
          set -e
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.alotrojah.ma/api/v1/health)
          test "$code" = "200"
          hdr=$(curl -s -D - -o /dev/null -H 'Origin: https://alotrojah.ma' https://api.alotrojah.ma/api/v1/health)
          echo "$hdr" | grep -qi 'access-control-allow-origin: https://alotrojah.ma'

          if [ -n "${SMOKE_ADMIN_PASSWORD:-}" ]; then
            email="${SMOKE_ADMIN_EMAIL:-admin@example.org}"
            login=$(curl -s -X POST https://api.alotrojah.ma/api/v1/auth/login \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              --data "{\"email\":\"${email}\",\"password\":\"${SMOKE_ADMIN_PASSWORD}\"}")
            token=$(printf '%s' "$login" | php -r '$d=json_decode(stream_get_contents(STDIN),true); echo $d["data"]["access_token"] ?? "";')
            test -n "$token"
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/json' \
              https://api.alotrojah.ma/api/v1/auth/me)
            test "$code" = "200"
            echo 'AUTH SMOKE VERIFIED'
          else
            echo 'AUTH SMOKE SKIPPED (SMOKE_ADMIN_PASSWORD not set)'
          fi
          echo 'PROD VERIFIED'
